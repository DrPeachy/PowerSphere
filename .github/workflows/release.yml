name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows installer and portable zip
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: pnpm install --frozen-lockfile

      # Code signing is intentionally skipped. Add bundle.windows.certificateThumbprint
      # or bundle.windows.signCommand later; do not set a sign command here.
      - name: Build NSIS installer
        run: pnpm tauri build --bundles nsis

      - name: Package portable zip
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $candidates = @(
            "src-tauri\target\release\powersphere.exe",
            "src-tauri\target\release\PowerSphere.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) {
            throw "release executable not found"
          }
          $zip = "PowerSphere-$env:RELEASE_TAG-windows-x64-portable.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          Write-Host "packed $zip from $exe"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            PowerSphere-*-windows-x64-portable.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
