[package]
name = "powersphere"
version = "0.1.0"
description = "Floating sphere launcher for Windows"
authors = ["DrPeachy"]
license = "GPL-3.0-only"
edition = "2024"
rust-version = "1.90"

[lib]
name = "powersphere_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
